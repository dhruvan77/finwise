<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinWise AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--line:#E2E8F0;--ink:#0F172A;--mut:#64748B;--pri:#059669;--pri2:#047857;--ter:#2563EB;--warn:#F59E0B;--bad:#EF4444;--rail:#0F172A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.num{font-family:'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em;margin:0}
.num,td,.tn{font-feature-settings:"tnum" 1,"cv05" 1}
#rail{position:fixed;inset:0 auto 0 0;width:260px;background:var(--rail);color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:2px;z-index:20;transition:transform .2s}
#rail .logo{color:#fff;font:700 20px 'Plus Jakarta Sans';padding:0 12px 16px}#rail .logo small{display:block;font:500 10px Inter;letter-spacing:.12em;color:#10B981}
#rail a{padding:9px 12px;border-radius:6px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:14px}#rail a:hover{background:#1E293B}#rail a.on{background:var(--pri);color:#fff}
#rail .sec{font:600 11px Inter;letter-spacing:.08em;color:#64748B;padding:14px 12px 4px;text-transform:uppercase}
#rail .foot{margin-top:auto;padding:12px;background:#1E293B;border-radius:8px;font-size:12px}
#main{margin-left:260px;min-height:100vh}
#top{position:sticky;top:0;z-index:10;background:rgba(248,250,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 32px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 12px;display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--mut)}.chip b{font:700 16px 'Plus Jakarta Sans';color:var(--pri)}
#menu{display:none}#view{padding:28px 32px;max-width:1600px}
.grid{display:grid;gap:24px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g83{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}.card h3{font-size:18px}.sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.lbl{font:600 11px Inter;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}.big{font:700 28px/1.2 'Plus Jakarta Sans';letter-spacing:-.025em;margin:4px 0}
.ai{border-top:3px solid var(--pri);background:#F0FDF4}
.pos{color:#065F46}.neg{color:#991B1B}.mut{color:var(--mut)}
.badge{display:inline-flex;padding:2px 8px;border-radius:99px;font:600 11px Inter;letter-spacing:.04em;border:1px solid #CBD5E1;background:#F1F5F9;color:#334155;text-transform:uppercase}
.badge.good{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}.badge.warn{background:#FFFBEB;color:#92400E;border-color:#FDE68A}.badge.bad{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
button,.btn{height:40px;padding:0 16px;border-radius:6px;border:1px solid #047857;background:var(--pri);color:#fff;font:600 14px Inter;cursor:pointer}button:hover{background:var(--pri2)}
button.sec{background:#fff;color:#1E293B;border-color:#CBD5E1}button.sec:hover{background:#F1F5F9}button.sm{height:30px;padding:0 10px;font-size:12px}button:disabled{opacity:.5;cursor:wait}
button.dng{background:#fff;color:var(--bad);border-color:#FECACA}
input,select{height:40px;width:100%;border:1px solid #CBD5E1;border-radius:6px;padding:0 12px;font:15px Inter;background:#fff;color:var(--ink)}input:focus,select:focus{outline:0;border-color:var(--ter);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
label{display:block;font:600 12px Inter;color:var(--mut);margin:12px 0 4px}
table{width:100%;border-collapse:collapse}th{background:var(--bg);text-align:left;font:600 11px Inter;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid #F1F5F9;font-size:14px}tr:hover td{background:var(--bg)}.r{text-align:right}.scroll{overflow-x:auto}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar{height:6px;background:#E2E8F0;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:12px 16px;border-radius:8px;margin-bottom:16px}.note{font-size:12px;color:var(--mut);margin-top:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{height:32px}.tabs button.on{background:var(--rail);border-color:var(--rail);color:#fff}
.ph{margin-bottom:24px}.ph h1{font-size:32px}.ph p{color:var(--mut);margin:4px 0 0;max-width:720px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;z-index:5}
.chart{position:relative}.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.msg{padding:12px 16px;border-radius:8px;margin-bottom:12px;max-width:760px;white-space:pre-wrap}.msg.u{background:var(--rail);color:#fff;margin-left:auto}.msg.a{background:#fff;border:1px solid var(--line)}
#login{max-width:420px;margin:8vh auto;padding:0 16px}
@media(max-width:1279px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g83{grid-template-columns:1fr}}
@media(max-width:899px){#rail{transform:translateX(-100%)}#rail.open{transform:none}#main{margin-left:0}#menu{display:block}#view{padding:16px}#top{padding:10px 16px}.g5,.g4,.g3,.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div class="tt" id="tt"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=(v,d=0)=>v==null?'—':(v<0?'-':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const cmp=v=>{const a=Math.abs(v),s=v<0?'-':'';return a>=1e7?s+'₹'+(a/1e7).toFixed(1)+'Cr':a>=1e5?s+'₹'+(a/1e5).toFixed(1)+'L':a>=1e3?s+'₹'+Math.round(a/1e3)+'k':s+'₹'+Math.round(a)};
const nice=s=>String(s||'').replace(/_/g,' ');const sev=s=>({high:'bad',medium:'warn',low:'',affordable:'good',affordable_with_caution:'warn',not_recommended:'bad'}[s]??'');
const API_BASE='http://localhost:8000/api/v1'; // set once at deploy time
const S={base:API_BASE,tok:localStorage.fwTok||'',tw:null};
async function api(p,o={}){const h={};if(S.tok)h.Authorization='Bearer '+S.tok;let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
 let r;try{r=await fetch(S.base+p,{method:o.method||'GET',headers:h,body:b})}catch{throw new Error('Unable to connect to FinWise. Please check your connection and try again.')}
 if(r.status==204)return null;const d=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status==401&&S.tok){S.tok='';localStorage.removeItem('fwTok');setTimeout(boot,0)}throw new Error(d.error?.message||'Request failed ('+r.status+')')}return d}
/* ---------- charts (inline SVG, dashed grid, 2px strokes per design system) ---------- */
function line(id,series,o={}){const W=720,H=o.h||260,L=56,R=12,T=10,B=26;const n=series[0].pts.length;let all=[];series.forEach(s=>s.pts.forEach(p=>all.push(p.y,p.lo??p.y,p.hi??p.y)));
 let mn=Math.min(...all),mx=Math.max(...all);if(mn==mx){mn-=1;mx+=1}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;const X=i=>L+i*(W-L-R)/Math.max(1,n-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2E8F0" stroke-dasharray="4 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#64748B">${cmp(v)}</text>`}
 for(let i=0;i<5;i++){const k=Math.round(i*(n-1)/4);g+=`<text x="${X(k)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#64748B">${esc(String(series[0].pts[k].x).slice(o.sl||5))}</text>`}
 series.forEach(s=>{if(s.pts[0].lo!=null){g+=`<path d="M${s.pts.map((p,i)=>X(i)+','+Y(p.hi)).join('L')}L${s.pts.map((p,i)=>X(n-1-i)+','+Y(s.pts[n-1-i].lo)).join('L')}Z" fill="${s.c}" opacity=".12"/>`}
  g+=`<path d="M${s.pts.map((p,i)=>X(i)+','+Y(p.y)).join('L')}" fill="none" stroke="${s.c}" stroke-width="2" ${s.d?'stroke-dasharray="6 4"':''}/>`});
 $(id).innerHTML=`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}<line id="cx" y1="${T}" y2="${H-B}" stroke="#94A3B8" display="none"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg>`;
 const svg=$(id+' svg'),tt=$('#tt'),cx=$(id+' #cx');svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,i=Math.max(0,Math.min(n-1,Math.round((x-L)/((W-L-R)/Math.max(1,n-1)))));cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.removeAttribute('display');tt.style.display='block';tt.style.left=e.pageX+14+'px';tt.style.top=e.pageY+14+'px';tt.innerHTML=esc(series[0].pts[i].x)+series.map(s=>`<br>${esc(s.n)}: ${inr(s.pts[i].y)}`).join('')};svg.onmouseleave=()=>{tt.style.display='none';cx.setAttribute('display','none')}}
function bars(id,months){const W=720,H=240,L=56,T=10,B=26,mx=Math.max(...months.flatMap(m=>[m.income,m.expenses]),1),bw=(W-L)/months.length;const Y=v=>T+(1-v/mx)*(H-T-B);let g='';
 for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2E8F0" stroke-dasharray="4 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#64748B">${cmp(v)}</text>`}
 months.forEach((m,i)=>{const x=L+i*bw+bw*.15,w=bw*.33;g+=`<rect x="${x}" y="${Y(m.income)}" width="${w}" height="${H-B-Y(m.income)}" fill="#059669"><title>${m.month} income ${inr(m.income)}</title></rect><rect x="${x+w+2}" y="${Y(m.expenses)}" width="${w}" height="${H-B-Y(m.expenses)}" fill="#BFDBFE"><title>${m.month} expenses ${inr(m.expenses)}</title></rect><text x="${x+w}" y="${H-8}" text-anchor="middle" font-size="10" fill="#64748B">${m.month.slice(2)}</text>`});
 $(id).innerHTML=`<div class="legend"><span><i style="background:#059669"></i>Income</span><span><i style="background:#BFDBFE"></i>Expenses</span></div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`}
const COL=['#059669','#2563EB','#93C5FD','#6EE7B7','#475569','#F59E0B'];
function donut(rows){const tot=rows.reduce((a,r)=>a+r.amount,0)||1;let off=0;const C=2*Math.PI*40;return `<div class="row" style="justify-content:center"><svg viewBox="0 0 100 100" width="170" style="transform:rotate(-90deg)">${rows.map((r,i)=>{const l=r.amount/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[i%6]}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')}</svg></div><div style="margin-top:12px">${rows.map((r,i)=>`<div class="row" style="font-size:13px;margin:4px 0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${COL[i%6]};margin-right:8px"></i>${esc(r.category)}</span><span class="tn">${inr(r.amount)} <span class="mut">(${r.pct_of_expenses}%)</span></span></div>`).join('')}</div>`}
/* ---------- helpers ---------- */
const card=(t,s,b,c='')=>`<div class="card ${c}"><h3>${t}</h3>${s?`<div class="sub">${s}</div>`:''}${b}</div>`;
const kpi=(l,v,s='',c='')=>`<div class="card"><div class="lbl">${l}</div><div class="big ${c}">${v}</div><div class="mut" style="font-size:12px">${s}</div></div>`;
const head=(t,p)=>`<div class="ph"><h1>${t}</h1><p>${p}</p></div>`;
const tbl=(cols,rows)=>`<div class="scroll"><table><tr>${cols.map(c=>`<th class="${c[1]?'r':''}">${c[0]}</th>`).join('')}</tr>${rows.join('')||`<tr><td colspan="${cols.length}" class="mut">Nothing to show yet.</td></tr>`}</table></div>`;
const disc=r=>`<div class="note">${esc(r.disclaimer||'Informational decision support, not regulated financial advice.')}</div>`;
const empty=()=>card('No data yet','Import a bank statement from the Transactions page, or load sample data to explore every screen.',`<button onclick="demo()">Load sample data</button>`);
async function demo(){try{await api('/import/demo?force=true',{method:'POST'});go()}catch(e){alert(e.message)}}
const field=(id,l,v,t='number')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" step="any">`;
const sel=(id,l,opts)=>`<label for="${id}">${l}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`;
/* ---------- views ---------- */
const V={};
V.dashboard=async()=>{const tw=S.tw;if(!tw.data_quality.transactions)return head('Overview','Your financial decision dashboard.')+empty();
 const [mo,cat,pb,rec,tx,an]=await Promise.all([api('/analytics/monthly?months=12'),api('/analytics/categories'),api('/predictions/balance'),api('/recurring'),api('/transactions?page_size=6'),api('/anomalies')]);
 const sv=tw.savings,inc=tw.income.average_monthly,exp=tw.spending.average_monthly,h30=pb.horizons?.['30d'],lim=new Date(Date.now()+12*864e5).toISOString().slice(0,10);
 const up=(tw.upcoming_payments||[]).filter(u=>u.direction=='debit'&&u.date<=lim);
 const months=mo.months.filter(m=>!m.is_partial);
 setTimeout(()=>{bars('#c1',months);if(pb.daily_series)line('#c2',[{n:'Predicted balance',c:'#2563EB',pts:pb.daily_series.map(d=>({x:d.date,y:d.balance,lo:d.lower,hi:d.upper}))}])},0);
 return head('Overview',`Balance and forecasts derived from ${tw.data_quality.transactions} transactions (${tw.data_quality.complete_months} complete months). All figures are computed deterministically by the backend.`)+
 `<div class="grid g5">${kpi('Current balance',inr(tw.balance.current),'Source: '+nice(tw.balance.source))}${kpi('Avg monthly income',inr(inc),'Trend: '+tw.income.trend)}${kpi('Avg monthly expenses',inr(exp),'Trend: '+tw.spending.trend)}${kpi('Avg net savings',inr(sv.average_monthly_net),'Per complete month',sv.average_monthly_net<0?'neg':'pos')}${kpi('Savings rate',sv.savings_rate_pct+'%','Runway '+sv.emergency_runway_months+' months')}</div>
 <div class="grid g4" style="margin:24px 0">${card('Predicted balance · 30d',h30?inr(h30.predicted_balance):'—',h30?`Range ${inr(h30.lower)} – ${inr(h30.upper)} · confidence ${esc(pb.confidence)}`:esc(pb.status),'ai')}
 ${card('Upcoming 12-day debits',inr(up.reduce((a,u)=>a+u.amount,0)),`${up.length} scheduled payment(s)`)}${card('Free cash flow / month',inr(sv.projected_monthly_free_cash_flow),'Recurring income − commitments − typical spend')}${card('90-day risk',`<span class="badge ${sev(tw.forecast.risk_level)}">${esc(tw.forecast.risk_level)}</span>`,`Lowest projected balance ${inr(tw.forecast.lowest_balance_90d)}`)}</div>
 <div class="grid g83"><div class="grid">${card('Income vs expenses','Complete months only','<div id="c1" class="chart"></div>')}${card('90-day balance forecast','Predicted with uncertainty band — hypothetical, not guaranteed','<div id="c2" class="chart"></div>')}</div>
 <div class="grid">${card('Spending breakdown','Last 30 days',donut(cat.categories.slice(0,6)))}${card('Open alerts',an.total+' flagged for review',an.items.slice(0,3).map(a=>`<div style="margin:8px 0"><span class="badge ${sev(a.severity)}">${a.severity}</span> <span style="font-size:13px">${esc(a.reason)}</span></div>`).join('')+'<a href="#alerts">View all →</a>')}</div></div>
 <div class="grid g2" style="margin-top:24px">${card('Upcoming commitments','Next 30 days',tbl([['Name'],['Due'],['Amount',1]],rec.upcoming_commitments.slice(0,7).map(u=>`<tr><td>${esc(u.name)}</td><td>${u.date}</td><td class="r tn ${u.direction=='credit'?'pos':''}">${u.direction=='credit'?'+':'-'}${inr(u.amount)}</td></tr>`)))}
 ${card('Recent transactions','',tbl([['Date'],['Description'],['Amount',1]],tx.items.map(t=>`<tr><td>${t.date}</td><td>${esc(t.merchant||t.description)}<div class="mut" style="font-size:12px">${esc(t.category)}</div></td><td class="r tn ${t.direction=='credit'?'pos':''}">${t.direction=='credit'?'+':'-'}${inr(+t.amount,2)}</td></tr>`))+'<a href="#transactions">Open full ledger →</a>')}</div>`};
V.twin=async()=>{const tw=S.tw;if(!tw.data_quality.transactions)return head('Financial Digital Twin','')+empty();
 const [hist,goals]=await Promise.all([api('/financial-twin/history?limit=30'),api('/goals')]);const s=tw.spending,f=tw.forecast;
 setTimeout(()=>hist.snapshots.length>1&&line('#c3',[{n:'Balance',c:'#059669',pts:[...hist.snapshots].reverse().map(x=>({x:x.date,y:x.balance}))}],{sl:0}),0);
 return head('Financial Digital Twin','A deterministic model of your liquidity, commitments and runway, rebuilt from your recorded transactions.')+
 `<div class="grid g4">${kpi('Data quality',esc(tw.data_quality.status),`${tw.data_quality.history_days} days of history`,'pos')}${kpi('Liquid balance',inr(tw.balance.current),'As of '+tw.as_of)}${kpi('Emergency runway',sv(tw)+' mo','Of average monthly expenses')}${kpi('Recurring commitments',inr(s.recurring_commitments_monthly),tw.recurring.count+' detected /month')}</div>
 <div class="grid g83" style="margin:24px 0"><div class="grid">${card('Cash-flow structure','Monthly averages',tbl([['Item'],['Amount',1]],[['Income',tw.income.average_monthly],['Essential spending',s.essential_monthly],['Discretionary spending',s.discretionary_monthly],['Recurring commitments',s.recurring_commitments_monthly],['Net savings',tw.savings.average_monthly_net],['Free cash flow (projected)',tw.savings.projected_monthly_free_cash_flow]].map(r=>`<tr><td>${r[0]}</td><td class="r tn">${inr(r[1])}</td></tr>`)))}
 ${card('Forward projection','',tbl([['Horizon'],['Predicted balance',1]],[['Now',tw.balance.current],['+30 days',f.balance_30d],['+90 days',f.balance_90d],['Lowest in 90d',f.lowest_balance_90d]].map(r=>`<tr><td>${r[0]}</td><td class="r tn">${inr(r[1])}</td></tr>`))+disc({}))}
 ${hist.snapshots.length>1?card('Balance history','Saved twin snapshots','<div id="c3" class="chart"></div>'):''}</div>
 <div class="grid">${card('Goals','',(goals.goals||[]).map(g=>`<div style="margin:12px 0"><div class="row"><b>${esc(g.name)}</b><span class="badge ${g.feasibility.verdict.startsWith('on')?'good':'warn'}">${nice(g.feasibility.verdict)}</span></div><div class="bar" style="margin:6px 0"><i style="width:${Math.min(100,g.progress_pct)}%"></i></div><div class="mut tn" style="font-size:12px">${inr(g.current_amount)} / ${inr(g.target_amount)} · ${g.progress_pct}%</div></div>`).join('')||'<span class="mut">No goals.</span>')}
 ${card('Top categories','Last 90 days',donut(s.top_categories_last_90d))}</div></div>
 ${card('Detected recurring flows','',tbl([['Name'],['Kind'],['Frequency'],['Next'],['Amount',1]],tw.recurring.items.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="badge">${r.kind}</span></td><td>${r.frequency}</td><td>${r.next_date}</td><td class="r tn">${inr(r.amount)}</td></tr>`)))}`};
const sv=tw=>tw.savings.emergency_runway_months;
const SC={purchase:['Large purchase',[['amount','Amount (₹)',35000],['days_from_now','Days from now',30]],1],loan:['Take a loan',[['principal','Principal (₹)',300000],['months','Tenure (months)',24],['annual_rate_pct','Rate % p.a.',11],['days_from_now','Days from now',1]]],salary_delay:['Salary delay',[['days','Delay (days)',15]]],salary_loss:['Income loss',[['months','Months',2]]],unexpected_expense:['Unexpected expense',[['amount','Amount (₹)',50000],['days_from_now','Days from now',5]]],new_subscription:['New subscription',[['monthly_amount','Monthly (₹)',999]]],increase_income:['Income increase',[['monthly_amount','Extra per month (₹)',10000]]],increase_monthly_savings:['Save more monthly',[['monthly_amount','Amount (₹)',5000]]]};
const ST={salary_delay:['Salary delay',[['days','Delay (days)',30]]],medical_expense:['Medical expense',[['amount','Amount (₹)',100000]]],large_purchase:['Large purchase',[['amount','Amount (₹)',150000]]],income_reduction:['Income reduction',[['percent','Reduction %',30],['months','Months',3]]],expense_increase:['Expense increase',[['percent','Increase %',20]]],income_loss:['Income loss',[['months','Months',2]]]};
const params=(def,k)=>{const o={};def[k][1].forEach(f=>o[f[0]]=+$('#p_'+f[0]).value);return o};
const paramFields=(def,k)=>def[k][1].map(f=>field('p_'+f[0],f[1],f[2])).join('')+(def[k][2]?sel('pay','Payment',[['cash','Full upfront'],['emi','EMI']])+`<div id="emi">${field('pm','EMI months',6)}${field('pr','Interest % p.a.',12)}</div>`:'');
const cmpTable=(a,b,la,lb)=>tbl([['Metric'],[la,1],[lb,1]],[['End balance','end_balance'],['Lowest balance','min_balance'],['Monthly net run-rate','monthly_run_rate_net']].map(m=>`<tr><td>${m[0]}</td><td class="r tn">${inr(a[m[1]])}</td><td class="r tn">${inr(b[m[1]])}</td></tr>`).concat(`<tr><td>Risk level</td><td class="r"><span class="badge ${sev(a.risk_level)}">${a.risk_level}</span></td><td class="r"><span class="badge ${sev(b.risk_level)}">${b.risk_level}</span></td></tr>`));
const pts=a=>a.map(d=>({x:d.date,y:d.balance,lo:d.lower,hi:d.upper}));
function simOut(r){setTimeout(()=>line('#c4',[{n:'Baseline',c:'#059669',pts:pts(r.series.before)},{n:'With scenario',c:'#2563EB',d:1,pts:pts(r.series.after)}]),0);
 return `<div class="card ai"><div class="row"><h3>Verdict</h3><span class="badge ${sev(r.verdict)}">${nice(r.verdict)}</span></div><div class="big">${inr(r.delta.end_balance)} <span class="mut" style="font-size:14px;font-weight:500">change in end balance (${r.horizon_days}d)</span></div><div class="mut">Runway after: ${r.emergency_runway_months_after} months · Monthly savings ${inr(r.monthly_savings_before)} → ${inr(r.monthly_savings_after)}${r.emi?` · EMI ${inr(r.emi.monthly_emi)} (interest ${inr(r.emi.total_interest)})`:''}${r.loan?` · EMI ${inr(r.loan.monthly_emi)} (interest ${inr(r.loan.total_interest)})`:''}</div>${(r.cash_flow_risks||[]).map(x=>`<div class="neg" style="margin-top:6px">⚠ ${esc(x)}</div>`).join('')}${(r.warnings||[]).map(x=>`<div class="mut">${esc(x)}</div>`).join('')}</div>
 <div class="grid g2" style="margin-top:24px">${card('Comparative outcome','',cmpTable(r.before,r.after,'Baseline','Scenario'))}${card('Effect on goals','',tbl([['Goal'],['Before'],['After']],(r.effect_on_goals||[]).map(g=>`<tr><td>${esc(g.name)}</td><td>${nice(g.feasibility_before)}</td><td>${nice(g.feasibility_after)}</td></tr>`)))}</div>
 <div style="margin-top:24px">${card('Balance trajectory','Predicted, with uncertainty bands','<div id="c4" class="chart"></div>'+`<div class="note"><b>Assumptions:</b> ${(r.assumptions||[]).map(esc).join(' · ')}</div>`+disc(r))}</div>`}
V.simulator=async()=>{if(!S.tw.data_quality.transactions)return head('What-if Simulator','')+empty();
 setTimeout(()=>{const draw=()=>{const k=$('#sk').value;$('#pf').innerHTML=paramFields(SC,k);if(SC[k][2]){$('#pay').onchange=()=>$('#emi').style.display=$('#pay').value=='emi'?'':'none';$('#pay').onchange()}};$('#sk').onchange=draw;draw();
  $('#run').onclick=async e=>{const b=e.target,k=$('#sk').value,hz=+$('#hz').value;b.disabled=true;$('#out').innerHTML='<div class="mut">Computing…</div>';try{const p=params(SC,k);let r;
   if(k=='purchase'){const pay=$('#pay').value=='emi'?{type:'emi',months:+$('#pm').value,annual_rate_pct:+$('#pr').value}:{type:'cash'};r=await api('/simulations/purchase',{method:'POST',body:{item_name:'purchase',amount:p.amount,days_from_now:p.days_from_now,horizon_days:hz,payment:pay}})}
   else r=await api('/simulations/scenario',{method:'POST',body:{type:k,params:p,horizon_days:hz}});$('#out').innerHTML=simOut(r)}catch(x){$('#out').innerHTML=`<div class="err">${esc(x.message)}</div>`}b.disabled=false};
  $('#oc').onclick=async()=>{try{const a=+($('#p_amount')?.value||0);if(!a)return alert('Choose a scenario with an amount first.');const r=await api('/simulations/opportunity-cost',{method:'POST',body:{amount:a,years:5}});$('#ocr').innerHTML=tbl([['Annual return'],['Value after 5y',1],['Growth',1]],r.scenarios.map(s=>`<tr><td>${s.annual_return_pct}%</td><td class="r tn">${inr(s.lump_sum_value)}</td><td class="r tn pos">+${inr(s.growth)}</td></tr>`))+`<div class="note">${r.assumptions.map(esc).join(' ')}</div>`}catch(x){alert(x.message)}}},0);
 return head('What-if Simulator','Test a purchase, loan or income shock against your own cash-flow history before committing capital.')+`<div class="grid" style="grid-template-columns:340px 1fr"><div class="card"><h3>Scenario</h3>${sel('sk','Type',Object.entries(SC).map(([k,v])=>[k,v[0]]))}<div id="pf"></div>${sel('hz','Horizon',[[90,'90 days'],[180,'180 days'],[365,'365 days']])}<div style="margin-top:16px"><button id="run" style="width:100%">Run simulation</button></div><button class="sec" id="oc" style="width:100%;margin-top:8px">Opportunity cost of amount</button><div id="ocr" style="margin-top:12px"></div></div><div id="out"><div class="card mut">Configure a scenario and run it. Results appear here.</div></div></div>`};
function stressOut(r){setTimeout(()=>line('#c5',[{n:'Baseline',c:'#059669',pts:pts(r.series.baseline)},{n:'Stressed',c:'#EF4444',d:1,pts:pts(r.series.stressed)}]),0);const e=r.emergency_cash_runway;
 return `<div class="grid g4">${kpi('Runway (essential)',e.months_of_essential_expenses+' mo','Months of essential expenses')}${kpi('Runway (total)',e.months_of_total_expenses+' mo','Months of all expenses')}${kpi('Potential shortfall',inr(r.potential_shortfall),'Lowest balance '+inr(r.lowest_balance),r.potential_shortfall>0?'neg':'pos')}<div class="card"><div class="lbl">Risk level</div><div class="big"><span class="badge ${sev(r.risk_level)}">${r.risk_level}</span></div><div class="mut" style="font-size:12px">${r.can_cover_essential_expenses?'Essentials covered':'Essentials NOT covered'}</div></div></div>
 <div class="grid g83" style="margin-top:24px">${card('Shock trajectory',esc(r.scenario),'<div id="c5" class="chart"></div>'+disc(r))}${card('Suggested actions','Ranked by the backend engine',r.suggested_actions.map((a,i)=>`<div style="margin:10px 0"><b>${i+1}.</b> ${esc(a)}</div>`).join(''),'ai')}</div>`}
V.stress=async()=>{if(!S.tw.data_quality.transactions)return head('Stress Testing','')+empty();const past=await api('/stress-tests?limit=8');
 setTimeout(()=>{const draw=()=>$('#sf').innerHTML=ST[$('#st').value][1].map(f=>field('p_'+f[0],f[1],f[2])).join('');$('#st').onchange=draw;draw();
  $('#go').onclick=async e=>{const b=e.target;b.disabled=true;$('#out').innerHTML='<div class="mut">Running…</div>';try{const k=$('#st').value;$('#out').innerHTML=stressOut(await api('/stress-tests',{method:'POST',body:{type:k,params:params(ST,k),horizon_days:90}}))}catch(x){$('#out').innerHTML=`<div class="err">${esc(x.message)}</div>`}b.disabled=false}},0);
 return head('Stress Testing','Hypothetical shocks applied to your cash flow. Not a prediction that the event will occur.')+`<div class="card" style="margin-bottom:24px"><div class="grid g3" style="align-items:end"><div>${sel('st','Shock',Object.entries(ST).map(([k,v])=>[k,v[0]]))}</div><div id="sf"></div><div><button id="go">Run stress test</button></div></div></div><div id="out"></div><div style="margin-top:24px">${card('Previous runs','',tbl([['When'],['Type'],['Risk'],['Shortfall',1]],past.items.map(p=>`<tr><td>${esc((p.created_at||'').slice(0,16).replace('T',' '))}</td><td>${nice(p.kind)}</td><td><span class="badge ${sev(p.risk_level)}">${p.risk_level}</span></td><td class="r tn">${inr(p.potential_shortfall)}</td></tr>`)))}</div>`};
let TX={page:1,q:'',category:''};
V.transactions=async()=>{const [d,cats]=await Promise.all([api(`/transactions?page=${TX.page}&page_size=25&q=${encodeURIComponent(TX.q)}&category=${encodeURIComponent(TX.category)}`),api('/categories')]);
 setTimeout(()=>{$('#q').onkeydown=e=>{if(e.key=='Enter'){TX.q=e.target.value;TX.page=1;go()}};$('#cf').onchange=e=>{TX.category=e.target.value;TX.page=1;go()};$('#pv').onclick=()=>{TX.page--;go()};$('#nx').onclick=()=>{TX.page++;go()};
  $('#add').onclick=async()=>{try{await api('/transactions',{method:'POST',body:{date:$('#nd').value,description:$('#ns').value,amount:+$('#na').value,direction:$('#ndr').value}});go()}catch(x){alert(x.message)}};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;const k=f.name.endsWith('.pdf')?'pdf':/xlsx?$/.test(f.name)?'excel':'csv',fd=new FormData();fd.append('file',f);try{const j=await api('/import/'+k,{method:'POST',body:fd});alert(`Imported ${j.imported}, duplicates ${j.duplicates_skipped}, invalid ${j.invalid_rows}`);go()}catch(x){alert(x.message)}}},0);
 return head('Transactions','Searchable ledger with automatic categorisation. Import PDF, CSV or Excel statements.')+`<div class="card" style="margin-bottom:24px"><div class="grid g4" style="align-items:end"><div><label>Search (Enter)</label><input id="q" value="${esc(TX.q)}" placeholder="merchant or description"></div><div><label>Category</label><select id="cf"><option value="">All</option>${cats.categories.map(c=>`<option ${c.name==TX.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Import statement</label><input id="imp" type="file" accept=".csv,.xlsx,.pdf"></div><div class="mut" style="font-size:12px">${d.total} transactions</div></div></div>
 <div class="card" style="margin-bottom:24px"><h3>Add transaction</h3><div class="grid g5" style="align-items:end"><div><label>Date</label><input id="nd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div style="grid-column:span 2"><label>Description</label><input id="ns"></div><div><label>Amount ₹</label><input id="na" type="number" step="0.01"></div><div><label>Type</label><select id="ndr"><option value="debit">Debit</option><option value="credit">Credit</option></select></div></div><div style="margin-top:12px"><button id="add">Add</button></div></div>
 ${card('','',tbl([['Date'],['Description'],['Category'],['Amount',1]],d.items.map(t=>`<tr><td>${t.date}</td><td>${esc(t.merchant||t.description)}</td><td><span class="badge">${esc(t.category)}</span>${t.is_internal_transfer?' <span class="badge">transfer</span>':''}</td><td class="r tn ${t.direction=='credit'?'pos':''}">${t.direction=='credit'?'+':'-'}${inr(+t.amount,2)}</td></tr>`))+`<div class="row" style="margin-top:12px"><button class="sec sm" id="pv" ${d.page<=1?'disabled':''}>← Prev</button><span class="mut">Page ${d.page} of ${d.pages||1}</span><button class="sec sm" id="nx" ${d.page>=d.pages?'disabled':''}>Next →</button></div>`)}`};
const CH={id:null,m:[]};
V.coach=async()=>{setTimeout(()=>{const box=$('#chat'),draw=()=>{box.innerHTML=CH.m.map(m=>m.r=='u'?`<div class="msg u">${esc(m.t)}</div>`:`<div class="msg a">${esc(m.t)}${m.k?.length?'<hr>'+m.k.map(k=>`<div class="row"><span class="mut">${esc(k.label)}</span><b class="tn">${esc(k.value)}</b></div>`).join(''):''}${m.tools?.length?`<div class="note">Tools used: ${m.tools.map(nice).join(', ')}</div>`:''}${(m.f||[]).map(f=>`<button class="sec sm" style="margin:6px 6px 0 0" onclick="ask(this.textContent)">${esc(f)}</button>`).join('')}${m.d?`<div class="note">${esc(m.d)}</div>`:''}</div>`).join('');box.scrollTop=box.scrollHeight};
  window.ask=async t=>{t=t||$('#ci').value.trim();if(!t)return;$('#ci').value='';CH.m.push({r:'u',t});CH.m.push({r:'a',t:'Thinking…'});draw();try{const r=await api('/ai/chat',{method:'POST',body:{message:t,conversation_id:CH.id}});CH.id=r.conversation_id;CH.m.pop();CH.m.push({r:'a',t:r.answer,k:r.structured?.key_figures,tools:r.tools_used,f:r.structured?.suggested_follow_ups,d:r.disclaimer})}catch(x){CH.m.pop();CH.m.push({r:'a',t:'⚠ '+x.message})}draw()};$('#ci').onkeydown=e=>e.key=='Enter'&&ask();draw()},0);
 return head('AI Financial Coach','Ask about your money. The model only chooses tools and explains results — every figure comes from the deterministic backend.')+`<div class="card"><div id="chat" style="height:52vh;overflow:auto"></div><div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="ci" placeholder="Why did my expenses increase this month?"><button onclick="ask()">Send</button></div></div>`};
V.alerts=async()=>{const [a,n]=await Promise.all([api('/anomalies'),api('/notifications?refresh=true')]);
 setTimeout(()=>document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{await api(`/anomalies/${b.dataset.a}/status`,{method:'PUT',body:{status:b.dataset.s}});go()}catch(x){alert(x.message)}}),0);
 return head('Alerts & Anomalies','Statistical flags for review. They are not a determination of fraud.')+card('Open anomalies',a.total+' item(s)',tbl([['Severity'],['Date'],['Details'],['Amount',1],['']],a.items.map(x=>`<tr><td><span class="badge ${sev(x.severity)}">${x.severity}</span></td><td>${x.date}</td><td>${esc(x.reason)}<div class="mut" style="font-size:12px">${esc(x.recommended_action)}</div></td><td class="r tn">${inr(x.amount)}</td><td class="r"><button class="sec sm" data-a="${x.id}" data-s="reviewed_ok">It’s me</button> <button class="dng sm" data-a="${x.id}" data-s="dismissed">Dismiss</button></td></tr>`)))+`<div style="margin-top:24px">${card('Notifications',n.unread+' unread',tbl([['Type'],['Message']],n.items.slice(0,12).map(x=>`<tr><td><span class="badge ${x.severity=='warning'?'warn':''}">${nice(x.type)}</span></td><td><b>${esc(x.title)}</b><div class="mut" style="font-size:13px">${esc(x.message)}</div></td></tr>`)))}</div>`};
/* ---------- shell ---------- */
const NAV=[['Core intelligence'],['dashboard','Overview'],['twin','Financial Digital Twin'],['simulator','AI Simulator'],['stress','Stress Testing'],['Management'],['transactions','Transactions'],['alerts','Alerts & Anomalies'],['AI advisory'],['coach','AI Financial Coach']];
async function go(){const k=(location.hash.slice(2)||'dashboard'),v=$('#view');if(!v)return boot();document.querySelectorAll('#rail a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));$('#rail').classList.remove('open');
 try{S.tw=await api('/financial-twin');const t=S.tw;$('#chips').innerHTML=`<div class="chip">Balance <b>${inr(t.balance.current)}</b></div><div class="chip">Free cash flow/mo <b>${inr(t.savings.projected_monthly_free_cash_flow)}</b></div>`;v.innerHTML=await (V[k]||V.dashboard)()}catch(e){v.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function boot(){if(!S.tok)return loginView();
 $('#app').innerHTML=`<nav id="rail"><div class="logo">FinWise AI<small>FINANCIAL INTELLIGENCE</small></div>${NAV.map(n=>n[1]?`<a href="#/${n[0]}" data-k="${n[0]}">${n[1]}</a>`:`<div class="sec">${n[0]}</div>`).join('')}<div class="foot"><div id="who">Signed in</div><button class="sec sm" style="margin-top:8px" onclick="S.tok='';localStorage.removeItem('fwTok');boot()">Sign out</button></div></nav><div id="main"><div id="top"><button id="menu" class="sec sm" onclick="$('#rail').classList.toggle('open')">☰</button><div id="chips" style="display:flex;gap:12px;flex-wrap:wrap"></div><span class="mut" style="margin-left:auto;font-size:12px">Informational decision support, not financial advice</span></div><div id="view"><div class="mut">Loading…</div></div></div>`;
 api('/users/me').then(u=>$('#who').textContent=u.full_name||u.email).catch(()=>{});go()}
function loginView(){$('#app').innerHTML=`<div id="login"><div class="card"><h1 style="font-size:28px">FinWise AI</h1><div class="sub">Understand it. Predict it. Decide with it.</div><div id="le"></div>${field('le_m','Email','','email')}${field('lp','Password (min 8)','','password')}
 <div class="row" style="margin-top:16px"><button id="li">Sign in</button><button class="sec" id="lr">Register</button></div></div></div>`;
 const run=async(path,withPw)=>{const email=$('#le_m').value;try{const r=await api(path,{method:'POST',body:withPw?{email,password:$('#lp').value,full_name:email.split('@')[0]}:{email}});if(!r.access_token)throw new Error(r.message||'Account created. Please confirm your email, then sign in.');S.tok=r.access_token;localStorage.fwTok=S.tok;boot()}catch(e){$('#le').innerHTML=`<div class="err">${esc(e.message)}</div>`}};
 $('#li').onclick=()=>run('/auth/login',1);$('#lr').onclick=()=>run('/auth/register',1)}
addEventListener('hashchange',()=>S.tok&&go());boot();
</script></body></html>

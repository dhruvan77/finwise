# Local development: API + a local Postgres. For production use Supabase Postgres via DATABASE_URL instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finwise
      POSTGRES_PASSWORD: finwise_local_only
      POSTGRES_DB: finwise
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwise"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://finwise:finwise_local_only@db:5432/finwise
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
